<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>led888.com 顶级域名出售 - 100万元人民币</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: #050505;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* LED 流光背景动画 */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, #00ccff33, transparent);
            animation: lightStream 8s infinite linear;
            z-index: 0;
        }

        @keyframes lightStream {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .container {
            position: relative;
            z-index: 1;
        }

        .domain {
            font-size: 70px;
            font-weight: bold;
            color: #00ccff;
            text-shadow: 0 0 15px #00ccff, 0 0 30px #00ccff;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .tag {
            font-size: 26px;
            margin-bottom: 10px;
            color: #eee;
            text-shadow: 0 0 5px #fff;
        }

        .price {
            font-size: 42px;
            font-weight: bold;
            color: #ff3333;
            text-shadow: 0 0 15px #ff3333;
            margin: 25px 0;
        }

        .desc {
            font-size: 20px;
            max-width: 750px;
            line-height: 1.9;
            color: #ccc;
            margin-bottom: 45px;
        }

        .contact {
            font-size: 22px;
            padding: 16px 40px;
            background: #00ccff;
            color: #000;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            transition: 0.3s;
            box-shadow: 0 0 15px #00ccff;
            display: inline-block;
            margin-bottom: 15px;
        }

        .contact:hover {
            background: #00aadd;
            transform: scale(1.05);
        }

        .qq {
            font-size: 24px;
            color: #00ccff;
            font-weight: bold;
            text-shadow: 0 0 10px #00ccff;
            margin-top: 10px;
        }

        .footer {
            margin-top: 60px;
            font-size: 15px;
            color: #777;
        }

        @media (max-width:768px) {
            .domain { font-size: 44px; }
            .price { font-size: 32px; }
            .tag { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="domain">led888.com</div>
        <div class="tag">极品LED行业域名 · 稀缺好记</div>
        <div class="price">售价：1,000,000 元人民币</div>
        <div class="desc">
            适用于 LED 照明、显示屏、光电科技、灯饰品牌、电商平台。<br>
            数字吉利、简短易记、自带流量，品牌价值与投资价值极高。
        </div>

        <a class="contact" href="javascript:;">有意购买请联系</a>
        <div class="qq">QQ：302880018</div>

        <div class="footer">非诚勿扰 · 中介可合作</div>
    </div>
</body>
</html>
